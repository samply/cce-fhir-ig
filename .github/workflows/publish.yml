name: Build and Publish CCE FHIR IG

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IG_PUBLISHER_VERSION: 2.3.4
      SUSHI_VERSION: 3.20.1

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v7

      # Setup Node (for SUSHI)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Install SUSHI
      - name: Install SUSHI
        run: npm install -g fsh-sushi@${SUSHI_VERSION}

      # Install Jekyll
      - name: Install Jekyll
        run: |
          gem install --user-install jekyll bundler
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      # Run SUSHI
      - name: Run SUSHI
        run: sushi .

      # Setup Java (needed for IG Publisher)
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # Download pinned IG Publisher version
      - name: Download publisher
        run: |
          mkdir -p input-cache
          wget -q https://github.com/HL7/fhir-ig-publisher/releases/download/${IG_PUBLISHER_VERSION}/publisher.jar -O input-cache/publisher.jar

      # Cache terminology lookups to speed up builds
      - name: Cache terminology
        uses: actions/cache@v4
        with:
          path: txcache
          key: terminology-${{ runner.os }}-${{ hashFiles('fsh-generated/**') }}
          restore-keys: |
            terminology-${{ runner.os }}-

      # Print tool versions used for this build
      - name: Show build tool versions
        run: |
          sushi --version
          java -jar input-cache/publisher.jar -v

      # Build IG with the public terminology server
      - name: Build IG
        run: java -jar input-cache/publisher.jar -ig . -tx https://tx.fhir.org

      # Verify package exists
      - name: Check package
        run: ls -l

      # Download FHIR Validator
      - name: Download Validator
        run: wget -q https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar -O validator.jar

      # Validate package
      - name: Validate package
        run: java -jar validator.jar -version 4.0.1 -ig output/package.tgz

      # Package the validator, IG package, and validation helpers into a single release archive
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x tools/validate.sh
          zip -j cce-fhir-ig-bundle-${{ github.ref_name }}.zip \
            validator.jar output/package.tgz \
            tools/validate.sh tools/validate.bat tools/README.md

      # Publish the release archive on tagged builds
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CCE FHIR IG ${{ github.ref_name }}
          generate_release_notes: true
          files: cce-fhir-ig-bundle-${{ github.ref_name }}.zip

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@4.1.3
        with:
            branch: gh-pages
            folder: output

      # Upload to Simplifier (tagged releases only, skipped if credentials are unset)
      - name: Upload package to Simplifier
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIMPLIFIER_PROJECT != '' && env.SIMPLIFIER_USER != '' && env.SIMPLIFIER_PASS != ''
        env:
          SIMPLIFIER_USER: ${{ secrets.SIMPLIFIER_USER }}
          SIMPLIFIER_PASS: ${{ secrets.SIMPLIFIER_PASS }}
        run: |
          # Zip only real FHIR resources (files whose JSON has a "resourceType" key),
          # at the archive root, so the Simplifier project import doesn't choke on
          # publisher-generated files such as canonicals.json / qa.json / *_manifest.json.
          rm -rf simplifier-upload && mkdir -p simplifier-upload
          python3 - <<'EOF'
          import glob, json, os, shutil
          for f in glob.glob('output/*.json'):
              with open(f) as fh:
                  try:
                      d = json.load(fh)
                  except Exception:
                      continue
              if isinstance(d, dict) and 'resourceType' in d:
                  shutil.copy(f, os.path.join('simplifier-upload', os.path.basename(f)))
          EOF
          ls simplifier-upload | head
          (cd simplifier-upload && zip -qr ../simplifier-project.zip .)

          TOKEN_FILE=$(mktemp)
          HTTP_STATUS=$(curl -sS -o "$TOKEN_FILE" -w "%{http_code}" -X POST https://api.simplifier.net/token \
            -H "Content-Type: application/json" \
            -d "{\"Email\":\"$SIMPLIFIER_USER\",\"Password\":\"$SIMPLIFIER_PASS\"}")
          echo "token endpoint status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            TOKEN=$(python3 -c "import json; print(json.load(open('$TOKEN_FILE'))['token'])")
            rm -f "$TOKEN_FILE"
            echo "Authenticated with JWT, uploading to ${{ vars.SIMPLIFIER_PROJECT }}"
            curl -sS -f -X PUT "https://api.simplifier.net/${{ vars.SIMPLIFIER_PROJECT }}/zip" \
              -H "Authorization: Bearer $TOKEN" \
              --data-binary "@simplifier-project.zip"
          else
            echo "warning: JWT token login failed, response body:"
            cat "$TOKEN_FILE"
            rm -f "$TOKEN_FILE"
            echo "Falling back to Basic Auth for the ZIP endpoint..."
            curl -sS -f -X PUT "https://api.simplifier.net/${{ vars.SIMPLIFIER_PROJECT }}/zip" \
              -u "${SIMPLIFIER_USER}:${SIMPLIFIER_PASS}" \
              --data-binary "@simplifier-project.zip"
          fi
